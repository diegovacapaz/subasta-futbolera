name: Siluetas

# Genera sil/<clave>.png para cada jugador de tools/jugadores.json.
# Corre sola cuando cambia la lista o el script, y se puede lanzar a mano desde la pestaña Actions.
# Guarda lo hecho cada 25 minutos. Si no termina en una corrida, se vuelve a lanzar sola para seguir.
on:
  workflow_dispatch:
    inputs:
      minutos:
        description: Minutos máximos de trabajo por corrida
        default: '320'
      reintentar:
        description: Volver a probar los jugadores que no tuvieron foto (si / no)
        default: 'no'
  push:
    branches: [main]
    paths: ['tools/jugadores.json', 'tools/siluetas.py']

permissions:
  contents: write
  actions: write

concurrency:
  group: siluetas
  cancel-in-progress: false

jobs:
  siluetas:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install "rembg[cpu]==2.0.66" "opencv-python-headless==4.10.0.84" pillow numpy

      - name: Modelo de recorte en caché
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-human-seg-v1

      - name: Generar y guardar siluetas
        id: gen
        env:
          MINUTOS: ${{ github.event.inputs.minutos || '320' }}
          REINTENTAR: ${{ github.event.inputs.reintentar || 'no' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EXTRA=""; [ "$REINTENTAR" = "si" ] && EXTRA="--reintentar"
          FIN=$(( $(date +%s) + MINUTOS * 60 ))
          while :; do
            RESTA=$(( (FIN - $(date +%s)) / 60 ))
            [ "$RESTA" -lt 3 ] && break
            T=$(( RESTA < 25 ? RESTA : 25 ))
            python tools/siluetas.py --minutos "$T" --resumen /tmp/resumen.json $EXTRA
            EXTRA=""
            LISTAS=$(python -c "import json;print(json.load(open('/tmp/resumen.json'))['siluetas'])")
            PEND=$(python -c "import json;print(json.load(open('/tmp/resumen.json'))['pendientes'])")
            HECHOS=$(python -c "import json;print(json.load(open('/tmp/resumen.json'))['hechos'])")
            git add sil
            if ! git diff --cached --quiet; then
              git commit -q -m "Siluetas: $LISTAS listas, faltan $PEND"
              for i in 1 2 3; do git pull --rebase -X theirs -q origin main && git push -q origin main && break; sleep 10; done
            fi
            echo "pendientes=$PEND" >> "$GITHUB_OUTPUT"
            echo "hechos=$HECHOS" >> "$GITHUB_OUTPUT"
            [ "$PEND" = "0" ] && break
            [ "$HECHOS" = "0" ] && break
          done

      - name: Guardar lo hecho si se corta
        if: cancelled() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sil
          git diff --cached --quiet && exit 0
          git commit -q -m "Siluetas: avance guardado al cortar"
          for i in 1 2 3; do git pull --rebase -X theirs -q origin main && git push -q origin main && break; sleep 10; done
      - name: Seguir si faltan
        if: success() && steps.gen.outputs.pendientes != '0' && steps.gen.outputs.hechos != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run siluetas.yml --ref main -f minutos="${{ github.event.inputs.minutos || '320' }}"
