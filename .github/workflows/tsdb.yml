name: Recortes TheSportsDB

# Baja de la API de TheSportsDB los recortes (fotos sin fondo) de cada jugador de tools/jugadores.json
# y guarda en tsdb/ las siluetas de cuerpo entero y de busto y la foto a color.
# Respeta el límite de la clave gratuita; guarda cada 25 minutos y se vuelve a lanzar sola si faltan.
# Para usar una clave paga, agregá el secreto TSDB_KEY en Settings → Secrets and variables → Actions.
on:
  workflow_dispatch:
    inputs:
      minutos:
        description: Minutos máximos de trabajo por corrida
        default: '320'
  push:
    branches: [main]
    paths: ['tools/tsdb.py', 'tools/medio.py']

permissions:
  contents: write
  actions: write

concurrency:
  group: tsdb
  cancel-in-progress: true

jobs:
  tsdb:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install "opencv-python-headless==4.10.0.84" pillow numpy
      - name: Bajar y guardar recortes
        id: gen
        env:
          MINUTOS: ${{ github.event.inputs.minutos || '320' }}
          TSDB_KEY: ${{ secrets.TSDB_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FIN=$(( $(date +%s) + MINUTOS * 60 ))
          while :; do
            RESTA=$(( (FIN - $(date +%s)) / 60 ))
            [ "$RESTA" -lt 3 ] && break
            T=$(( RESTA < 25 ? RESTA : 25 ))
            python tools/tsdb.py --minutos "$T" --resumen /tmp/resumen.json
            REC=$(python -c "import json;print(json.load(open('/tmp/resumen.json'))['recortes'])")
            PEND=$(python -c "import json;print(json.load(open('/tmp/resumen.json'))['pendientes'])")
            HECHOS=$(python -c "import json;print(json.load(open('/tmp/resumen.json'))['hechos'])")
            ESPERAS=$(python -c "import json;print(json.load(open('/tmp/resumen.json')).get('esperas', 0))")
            git add tsdb
            if ! git diff --cached --quiet; then
              git commit -q -m "Recortes TheSportsDB: $REC jugadores con recorte, faltan revisar $PEND (esperas por límite: $ESPERAS)"
              for i in 1 2 3; do git pull --rebase -X theirs -q origin main && git push -q origin main && break; sleep 10; done
              # que Commons complete a los recién revisados (solo si no está corriendo: si corre, ya los toma)
              ACTIVAS=$(gh run list --workflow commons.yml --limit 5 --json status -q '[.[] | select(.status != "completed")] | length' || echo 1)
              [ "$ACTIVAS" = "0" ] && gh workflow run commons.yml --ref main || true
            fi
            echo "pendientes=$PEND" >> "$GITHUB_OUTPUT"
            echo "hechos=$HECHOS" >> "$GITHUB_OUTPUT"
            [ "$PEND" = "0" ] && break
            [ "$HECHOS" = "0" ] && break
          done
      - name: Guardar lo hecho si se corta
        if: cancelled() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tsdb
          git diff --cached --quiet && exit 0
          git commit -q -m "Recortes TheSportsDB: avance guardado al cortar"
          for i in 1 2 3; do git pull --rebase -X theirs -q origin main && git push -q origin main && break; sleep 10; done
      - name: Seguir si faltan
        if: success() && steps.gen.outputs.pendientes != '0' && steps.gen.outputs.hechos != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tsdb.yml --ref main -f minutos="${{ github.event.inputs.minutos || '320' }}"
